name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Play a full game with bot phones
        run: npm run e2e:fast

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts
          path: test-artifacts/

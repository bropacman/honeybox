name: Deploy

# Publishes the game to GitHub Pages on every push to main. index.html is stamped here (npm run stamp:
# a content hash on every JS/CSS file so browsers pick up new code), so nobody has to stamp by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp index.html
        run: node scripts/stamp.mjs
      # only what the game serves: no tests, tools, worker or original photos
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html css js fonts images vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
